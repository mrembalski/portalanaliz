[project]
name = "portalanaliz"
version = "0.1.0"
description = "Archive and analyze the portalanaliz.pl forum"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portalanaliz*"]
